<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/style.css" />
    <script src="../scripts/index.js" defer></script>
    <title>ClientLab</title>
  </head>
  <body>
    <div class="bgOrb bgOrbOne" aria-hidden="true"></div>
    <div class="bgOrb bgOrbTwo" aria-hidden="true"></div>

    <div class="pageContainer">
      <header class="headerContainer">
        <div class="brandContainer">
          <span class="brandSymbol" aria-hidden="true">✦</span>
          <span class="brandTitle">ClientLab</span>
        </div>
        <span class="badge" id="clientCount">0 clientes</span>
      </header>

      <main class="mainContainer">
        <section class="formSection" aria-labelledby="formTitle">
          <header class="sectionHeader">
            <h2 class="sectionTitle" id="formTitle">Novo <em>cliente</em></h2>
            <p class="sectionSubTitle">
              Preencha os dados abaixo para cadastrar
            </p>
          </header>

          <form class="formContainer" id="form" novalidate autocomplete="off">
            <div class="fieldGroup" id="groupName">
              <label for="inputName" class="fieldLabel">Nome</label>
              <input
                type="text"
                id="inputName"
                class="input"
                placeholder="Seu nome..."
                minlength="4"
                autocomplete="off"
              />
              <span
                class="fieldFeedback"
                id="feedbackName"
                aria-live="polite"
              ></span>
            </div>

            <div class="fieldGroup" id="groupEmail">
              <label for="inputEmail" class="fieldLabel">E-mail</label>
              <input
                type="email"
                class="input"
                placeholder="email@example.com"
                autocomplete="off"
                autocapitalize="off"
              />
              <span
                class="fieldFeedback"
                id="feedbackEmail"
                aria-live="polite"
              ></span>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
